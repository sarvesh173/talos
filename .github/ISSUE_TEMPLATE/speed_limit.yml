name: Speed ceiling exceeded
description: A model streamed faster than the 5,000 tok/s animation ceiling and the orb could not keep up
title: "[speed] <model-id> exceeds 5000 tok/s"
labels: ["speed-limit", "needs-verification"]
body:
  - type: markdown
    attributes:
      value: |
        The orb animation saturates at **5,000 output tokens/second per user**.

        If a model genuinely streams faster, the animation stops telling the
        truth and the ceiling should move. Fill this in and the constant gets
        raised after the number is verified.

        Full instructions: [`.github/SPEED_LIMIT_REPORT.md`](../blob/main/.github/SPEED_LIMIT_REPORT.md)

  - type: input
    id: model
    attributes:
      label: Exact model id
      description: The string from the API response, not the display name.
      placeholder: e.g. nvidia/llama-4-scout-17b-16e-instruct
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Which endpoint served it.
      placeholder: e.g. cerebras / groq / openrouter / local commandcode proxy
    validations:
      required: true

  - type: input
    id: speed
    attributes:
      label: Measured output tokens/second (per user)
      description: completion_tokens divided by generation time. Use a 200+ token output so TTFT does not dominate.
      placeholder: e.g. 6200
    validations:
      required: true

  - type: dropdown
    id: measurement
    attributes:
      label: How was it measured
      options:
        - TALOS message footer (in-app)
        - Provider API usage block
        - core/llm_client.py benchmark script
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Paste the raw `usage` block or the benchmark output. Raw numbers only —
        do not paste API keys.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: This is per-user throughput, not aggregate throughput across concurrent requests
          required: true
        - label: No credentials are included in this report
          required: true
