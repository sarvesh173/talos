name: Build Native Android APK

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history + tags: release notes are generated from the commit
          # range between the previous tag and the one being released.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK for Release Artifact
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/talos-latest.apk
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/talos-${TAG_NAME}.apk"
          fi

      - name: Upload APK Artifact (every run)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: talos-apk-${{ github.sha }}
          path: build-artifacts/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Publish Rolling Latest Release (push builds)
        # Every push to main/dev refreshes the "Latest Build" release with a fresh APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "TALOS Latest Build"
          body: |
            Automated cloud build from `${{ github.ref_name }}` @ ${{ github.sha }}.

            Install: download `talos-latest.apk` and sideload.
          files: build-artifacts/talos-latest.apk
          draft: false
          # Not a prerelease: GitHub hides prereleases behind a filter, which
          # is exactly why the APK "wasn't visible" on the Releases page.
          prerelease: false
          # The rolling build is deliberately NOT the "Latest" release:
          # the newest *versioned* tag must stay pinned as Latest, otherwise
          # the Releases page shows an untagged rolling build instead of the
          # actual current version.
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## TALOS ${TAG_NAME}"
            echo
            echo "Material 3 Expressive build of the TALOS multi-agent mesh —"
            echo "compiled on GitHub Actions, packaged, signed and attached here."
            echo
            echo "### Install"
            echo
            echo "Download \`talos-${TAG_NAME}.apk\` and sideload it."
            echo
            echo "### Changes in this release"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "${TAG_NAME}^..${TAG_NAME}" || true
            echo
            echo
            echo "---"
            echo
            echo "Full changelog: [FEATURE.md](https://github.com/sarvesh173/talos/blob/${TAG_NAME}/FEATURE.md)"
          } > "${NOTES_FILE}"
          cat "${NOTES_FILE}"

      - name: Publish Versioned Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/talos-*.apk
          body_path: ${{ runner.temp }}/release-notes.md
          name: TALOS ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
